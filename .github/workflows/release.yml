name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test backend
        run: |
          go test ./...
          go vet ./...

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npx vitest run
          npm run build

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is not a tag"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n1 "refs/tags/$tag")"
          if [ "$sha" != "$tag_sha" ]; then
            echo "::error::checked-out commit $sha does not match tag $tag ($tag_sha)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build Windows binary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          BUILD_DATE: ${{ steps.version.outputs.date }}
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X main.commit=${SHA} -X main.buildDate=${BUILD_DATE}" \
            -o ibinds.exe ./cmd/ibinds

      - name: Generate checksums
        run: sha256sum ibinds.exe > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ibinds.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ibinds-${{ steps.version.outputs.tag }}
          path: |
            ibinds.exe
            SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: iBinds ${{ steps.version.outputs.tag }}
          body: |
            ## Install (Windows)

            1. Download `ibinds.exe`.
            2. Verify the SHA-256 checksum against `SHA256SUMS.txt`.
            3. Run `ibinds.exe`. It starts a local server and opens the UI in your browser.

            iBinds is portable: it needs no installer and no administrator rights. It only reads and writes the iRacing profiles folder on your machine.

            ## Verify the download

            ```powershell
            Get-FileHash .\ibinds.exe -Algorithm SHA256
            Get-Content .\SHA256SUMS.txt
            ```

            This release was built by GitHub Actions from the tagged source, and the binary has a build-provenance attestation. If you use the GitHub CLI:

            ```powershell
            gh attestation verify .\ibinds.exe --repo IanBertolucci/ibinds
            ```

            Windows SmartScreen may warn because the binary is not code-signed. Do not disable SmartScreen. Verify the checksum and the source before running, or build it yourself.

            ## Build from source

            Download the source zip below (or clone the tag), install Go 1.27+ and Node.js 20+, and run:

            ```powershell
            powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
            ```

            The build produces `ibinds.exe` in the repository root.

            ## Source

            The source archive for this tag is available under **Source code (zip)** below.
          files: |
            ibinds.exe
            SHA256SUMS.txt
          draft: false
          prerelease: false
